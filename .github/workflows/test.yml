name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin jq

      - name: Shell scripts parse
        run: for f in *.sh bin/agent-usage scripts/*.sh test/*.sh agent-usage@local/bin/agent-usage-update macos/agent-usage macos/*.sh macos/test/*.sh cinnamon/*.sh cinnamon/test/*.sh test/gnome/*.sh; do bash -n "$f"; done

      - name: Python compiles
        run: |
          for f in agent-usage@local/bin/agent-usage-claude agent-usage@local/bin/agent-usage-codex agent-usage@local/hooks/agent-usage-session cinnamon/*.py test/fake-collector test/gnome/*.py; do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done

      - name: JavaScript parses
        run: for f in agent-usage@local/*.js agent-usage@local/hooks/*.js; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs; done

      # The applet as install.sh builds it: Cinnamon's files and the shared
      # modules rewritten for Cinnamon, all plain scripts.
      - name: Cinnamon applet builds
        run: |
          cinnamon/build-applet.sh /tmp/applet 0.0.0
          for f in /tmp/applet/*.js; do cp "$f" /tmp/check.cjs; node --check /tmp/check.cjs; done

      - name: Settings schema compiles
        run: glib-compile-schemas --strict --dry-run agent-usage@local/schemas

      - name: Panel logic
        run: for t in test/*-test.js; do gjs -m "$t"; done

      - name: Claude limits back-off
        run: python3 test/claude-limits-test.py

      - name: Claude sign-in from the macOS Keychain
        run: python3 test/claude-keychain-test.py

      - name: Codex signed out
        run: python3 test/codex-sign-in-test.py

      - name: Session hooks in Claude Code and OpenCode
        run: python3 test/session-hooks-test.py

      - name: The OpenCode plugin
        run: node test/opencode-plugin-test.mjs

      - name: Install, update and uninstall from git
        run: test/cli-test.sh

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

  # The GNOME extension in a real GNOME Shell, headless, in Ubuntu's images:
  # the oldest and the newest GNOME it's made for (46 and 50).
  gnome:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container: ubuntu:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: The extension in a running GNOME Shell
        timeout-minutes: 20
        run: bash test/gnome/prepare-ubuntu.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/snapshots"

      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-${{ matrix.release }}
          path: snapshots/

  # The Cinnamon applet in a real Cinnamon, in Linux Mint's own images: it
  # installs, loads, draws its panel and survives a reinstall. Mint 23's
  # Cinnamon 6.8 can't be downloaded before its release; 6.6 with 6.8's way of
  # loading applets stands in for it.
  cinnamon:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mint21.3
            image: mint21.3
          - name: mint22.3
            image: mint22.3
          - name: mint22.3-loader6.8
            image: mint22.3
            loader: "6.8"
    container: linuxmintd/${{ matrix.image }}-amd64
    steps:
      - uses: actions/checkout@v4

      - name: The applet in a running Cinnamon
        timeout-minutes: 20
        env:
          CINNAMON_LOADER: ${{ matrix.loader }}
        run: bash cinnamon/test/prepare-mint.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/snapshots"

      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinnamon-${{ matrix.name }}
          path: snapshots/

  # The macOS app's logic, and the collectors with the Python a Mac has out of
  # the box: the one from Apple's Command Line Tools (3.9).
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Swift logic tests
        working-directory: macos
        run: swift test

      - name: Build the app
        run: macos/build-app.sh --zip

      - name: Panel snapshots
        timeout-minutes: 3
        run: '"macos/build/Agent Usage.app/Contents/MacOS/AgentUsage" --snapshot macos/snapshots'

      # The real app on a Mac with no agents signed in: it has to find Python
      # and its bundled collectors, and their records have to land. A session
      # waits for input meanwhile, so the screenshot of the real menu bar
      # shows the robot orange (when the runner allows screenshots at all).
      - name: The app starts and collects
        timeout-minutes: 3
        run: |
          usage=~/.local/state/omarchy/agents/usage
          sessions=~/.local/state/omarchy/agents/sessions
          mkdir -p "$sessions" macos/snapshots
          sleep 600 &
          waiting=$!
          now=$(($(date +%s) * 1000))
          printf '{"agent":"claude","session":"ci","state":"waiting","since":%s,"updated":%s,"pid":%s}\n' "$now" "$now" "$waiting" >"$sessions/claude-ci.json"
          "macos/build/Agent Usage.app/Contents/MacOS/AgentUsage" &
          pid=$!
          for _ in $(seq 90); do
            [[ -f $usage/claude.json && -f $usage/codex.json ]] && break
            sleep 1
          done
          screencapture -x macos/snapshots/menubar-real.png || echo "no screenshot"
          kill -0 $pid
          kill $pid "$waiting"
          cat ~/Library/Logs/AgentUsage/agent-usage.log
          for agent in claude codex; do
            /usr/bin/python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); print(r["id"], "|", r["usageStatusText"])' "$usage/$agent.json"
          done

      - name: Install, update and uninstall on macOS
        timeout-minutes: 5
        run: macos/test/cli-test.sh

      # scripts/release.sh creates the GitHub release right after pushing the
      # tag; this build usually finishes later, but waits for it if not.
      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 20); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" macos/build/Agent-Usage-macOS.zip --clobber

      - name: Keep the snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: macos/snapshots/*.png

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Usage-macOS
          path: macos/build/Agent-Usage-macOS.zip

      - name: macOS's own Python
        run: /usr/bin/python3 --version

      - name: Claude limits back-off
        run: /usr/bin/python3 test/claude-limits-test.py

      - name: Claude sign-in from the macOS Keychain
        run: /usr/bin/python3 test/claude-keychain-test.py

      - name: Codex signed out
        run: /usr/bin/python3 test/codex-sign-in-test.py

      # The Claude Code hooks run on this Python on a Mac, and find the agent
      # through ps rather than /proc.
      - name: Session hooks
        run: /usr/bin/python3 test/session-hooks-test.py

      - name: Collectors run without any agent data
        run: |
          export HOME=$(mktemp -d)
          for agent in claude codex; do
            /usr/bin/python3 "agent-usage@local/bin/agent-usage-$agent" --force |
              /usr/bin/python3 -c 'import json, sys; r = json.load(sys.stdin); print(r["id"], "|", r["usageStatusText"], "|", r["authHelpText"])'
          done
